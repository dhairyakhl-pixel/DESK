<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freelance Client Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7fb;--surface:#fff;--line:#e7e9ef;--text:#171a21;--muted:#737985;--accent:#111827;--accent-soft:#eef1f6;--success:#167245;--success-bg:#e8f6ee;--warning:#99600b;--warning-bg:#fff4df;--radius:14px}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:rgba(255,255,255,.94);border-right:1px solid var(--line);padding:26px 15px;position:fixed;height:100vh;backdrop-filter:blur(14px)}
.logo{font-size:19px;letter-spacing:-.3px;font-weight:750;padding:2px 13px 30px}
.nav button{width:100%;border:0;background:transparent;color:#5f6470;text-align:left;padding:11px 13px;border-radius:10px;margin-bottom:5px;font-weight:550;transition:.18s}
.nav button.active,.nav button:hover{background:var(--accent-soft);color:var(--text)}
.main{margin-left:248px;width:calc(100% - 248px);padding:34px 38px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{font-size:28px;letter-spacing:-.7px;font-weight:750}.subtitle{color:var(--muted);font-size:13.5px;margin-top:5px}
.primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:11px 16px;font-weight:650;box-shadow:0 2px 5px rgba(17,24,39,.12);transition:.18s}
.primary:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(17,24,39,.16)}
.search{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;width:100%;outline:none;box-shadow:0 1px 2px rgba(0,0,0,.02);transition:.18s}
.search:focus{border-color:#9aa2b1;box-shadow:0 0 0 3px #e9ecf2}.toolbar{display:flex;gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(20,25,35,.025)}
.client-row{display:grid;grid-template-columns:1.5fr 1.05fr .9fr .85fr 78px;align-items:center;padding:16px 20px;border-bottom:1px solid #eef0f3;gap:14px;transition:.15s}
.client-row:not(:first-child):hover{background:#fafbfc}.client-row:last-child{border-bottom:0}.client-name{font-weight:650;letter-spacing:-.1px}
.muted{font-size:12.5px;color:var(--muted);margin-top:3px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11.5px;font-weight:650;background:#f0f1f4}
.badge.paid{background:var(--success-bg);color:var(--success)}.badge.due{background:var(--warning-bg);color:var(--warning)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}.detail{max-width:1020px}
.back{border:0;background:transparent;padding:0;margin-bottom:20px;color:#626873;font-weight:550}.back:hover{color:var(--text)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 18px;padding:26px}
.field label{display:block;font-size:11px;letter-spacing:.04em;font-weight:750;margin-bottom:7px;color:#5c626d}
.field input,.field textarea,.field select{width:100%;border:1px solid #dfe2e7;border-radius:9px;padding:11px 12px;outline:none;background:#fff;color:var(--text);transition:.18s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#8d96a6;box-shadow:0 0 0 3px #edf0f5}.field textarea{min-height:105px;resize:vertical}
.full{grid-column:1/-1}.section-title{padding:18px 26px;border-top:1px solid var(--line);font-size:14px;font-weight:750}
.actions{display:flex;justify-content:flex-end;gap:10px;padding:18px 26px;border-top:1px solid var(--line);background:#fcfcfd}
.secondary{background:#fff;color:#343943;border:1px solid #dfe2e7;border-radius:9px;padding:10px 15px;font-weight:600;transition:.18s}.secondary:hover{background:#f7f8fa}
.meeting-list{padding:0 26px 22px}.meeting{border:1px solid #e7e9ee;background:#fbfcfd;border-radius:10px;padding:12px 14px;margin-top:9px;display:flex;justify-content:space-between;gap:15px}
.hidden{display:none}.stats{display:flex;gap:12px;margin-bottom:17px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 17px;min-width:155px;box-shadow:0 2px 8px rgba(20,25,35,.02)}
.stat small{font-size:12px;color:var(--muted)}.stat strong{font-size:21px;display:block;margin-top:3px;letter-spacing:-.4px}#simpleContent{min-height:150px}

/* Theme toggle */
.top-actions{display:flex;align-items:center;gap:10px}
.theme-toggle{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-weight:650;white-space:nowrap;transition:.18s}
.theme-toggle:hover{border-color:var(--muted);transform:translateY(-1px)}
body.dark-theme{
  --bg:#050505;--surface:#111111;--line:#303030;--text:#f5f5f5;--muted:#a1a1aa;
  --accent:#f5f5f5;--accent-soft:#262626;--success:#d4d4d4;--success-bg:#262626;
  --warning:#e5e5e5;--warning-bg:#292929;
  color-scheme:dark;
}
body.dark-theme .sidebar{background:rgba(12,12,12,.96)}
body.dark-theme .nav button{color:#b8b8b8}
body.dark-theme .nav button.active,body.dark-theme .nav button:hover{background:#262626;color:#fff}
body.dark-theme .primary{background:#f5f5f5;color:#080808;border-color:#f5f5f5;box-shadow:none}
body.dark-theme .primary:hover{box-shadow:0 5px 12px rgba(255,255,255,.08)}
body.dark-theme .search{background:#111;color:#f5f5f5;box-shadow:none}
body.dark-theme .search:focus{border-color:#777;box-shadow:0 0 0 3px #252525}
body.dark-theme .client-row{border-bottom-color:#292929}
body.dark-theme .client-row:not(:first-child):hover{background:#191919}
body.dark-theme .badge{background:#292929;color:#e5e5e5}
body.dark-theme .badge.paid,body.dark-theme .badge.due{background:#292929;color:#f5f5f5}
body.dark-theme .back{color:#b8b8b8}
body.dark-theme .field label{color:#c4c4c4}
body.dark-theme .field input,body.dark-theme .field textarea,body.dark-theme .field select{background:#101010;color:#f5f5f5;border-color:#383838;color-scheme:dark}
body.dark-theme .field input:focus,body.dark-theme .field textarea:focus,body.dark-theme .field select:focus{border-color:#888;box-shadow:0 0 0 3px #252525}
body.dark-theme .actions{background:#101010}
body.dark-theme .secondary{background:#171717;color:#f5f5f5;border-color:#383838}
body.dark-theme .secondary:hover{background:#262626}
body.dark-theme .meeting{background:#151515;border-color:#333}
body.dark-theme .section-title{border-top-color:#303030}
body.dark-theme .client-row[style]{color:#aaa!important}
@media(max-width:800px){.top-actions{gap:7px}.theme-toggle{padding:9px 10px;font-size:12px}}

@media(max-width:800px){.sidebar{width:70px;padding:18px 8px}.logo{font-size:0}.logo:after{content:"FD";font-size:18px}.nav button{font-size:0;text-align:center}.main{margin-left:70px;width:calc(100% - 70px);padding:22px 18px}.client-row{grid-template-columns:1fr 1fr}.client-row>*:nth-child(3),.client-row>*:nth-child(4),.client-row>*:nth-child(5){display:none}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Freelance Desk</div>
  <div class="nav">
    <button class="active" onclick="showHome()">Clients</button>
    <button onclick="showMeetings()">Meetings</button>
    <button onclick="showPayments()">Payments</button>
  </div>
</aside>

<main class="main">
  <section id="homeView">
    <div class="top">
      <div><h1>Clients</h1><div class="subtitle">Manage your freelance workflow</div></div>
      <div class="top-actions">
        <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()">Dark Mode</button>
        <button class="primary" onclick="newClient()">+ Create New</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>Total Clients</small><strong id="totalClients">0</strong></div>
      <div class="stat"><small>Upcoming Meetings</small><strong id="upcomingCount">0</strong></div>
      <div class="stat"><small>Payments Due</small><strong id="dueCount">0</strong></div>
    </div>
    <div class="toolbar"><input class="search" id="search" placeholder="Search clients by name, phone or email..." oninput="renderClients()"></div>
    <div class="card" id="clientList"></div>
  </section>

  <section id="detailView" class="hidden detail">
    <button class="back" onclick="showHome()">← Back to clients</button>
    <div class="top"><div><h1 id="detailTitle">New Client</h1><div class="subtitle">Client details can be edited anytime</div></div></div>
    <div class="card">
      <form id="clientForm">
        <div class="form-grid">
          <div class="field"><label>CLIENT NAME *</label><input id="name" required></div>
          <div class="field"><label>PHONE NUMBER</label><input id="phone" type="tel"></div>
          <div class="field"><label>EMAIL</label><input id="email" type="email"></div>
          <div class="field"><label>COUNTRY</label><input id="country"></div>
          <div class="field"><label>DATE INITIATED</label><input id="initiated" type="date"></div>
          <div class="field"><label>SUBMISSION DATE</label><input id="submission" type="date"></div>
          <div class="field"><label>MEETING REQUIRED</label><select id="meetingRequired"><option>No</option><option>Yes</option></select></div>
          <div class="field"><label>MEETING DATE</label><input id="meetingDate" type="date"></div>
          <div class="field"><label>MEETING TIME</label><input id="meetingTime" type="time"></div>
          <div class="field"><label>PAYMENT STATUS</label><select id="payment"><option>Due</option><option>Received</option></select></div>
          <div class="field"><label>PAYMENT DUE DATE</label><input id="paymentDue" type="date"></div>
          <div class="field full"><label>BRIEF ABOUT CLIENT / PROJECT</label><textarea id="brief"></textarea></div>
        </div>
        <div class="section-title">Meeting History</div>
        <div class="meeting-list" id="meetingHistory"></div>
        <div class="actions">
          <button type="button" class="secondary" onclick="showHome()">Cancel</button>
          <button type="submit" class="primary">Save Client</button>
        </div>
      </form>
    </div>
  </section>

  <section id="simpleView" class="hidden">
    <div class="top"><div><h1 id="simpleTitle"></h1><div class="subtitle">Overview</div></div></div>
    <div class="card" style="padding:25px" id="simpleContent"></div>
  </section>
</main>
</div>

<script>
const KEY="freelance_dashboard_clients_v1";
let clients=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId=null;

const $=id=>document.getElementById(id);
const THEME_KEY="freelance_dashboard_theme_v1";
function applyTheme(theme){
  const dark=theme==="dark";
  document.body.classList.toggle("dark-theme",dark);
  const button=$("themeToggle");
  if(button){
    button.textContent=dark?"Light Mode":"Dark Mode";
    button.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
    button.setAttribute("aria-pressed",String(dark));
  }
}
function toggleTheme(){
  const next=document.body.classList.contains("dark-theme")?"light":"dark";
  localStorage.setItem(THEME_KEY,next);
  applyTheme(next);
}
function save(){localStorage.setItem(KEY,JSON.stringify(clients));}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function fmt(d){if(!d)return "—";let x=new Date(d+"T00:00:00");return x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});}
function showOnly(id){["homeView","detailView","simpleView"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");}
function showHome(){showOnly("homeView");renderClients();}
function newClient(){
 editingId=null;$("clientForm").reset();$("detailTitle").textContent="New Client";
 $("initiated").value=new Date().toISOString().slice(0,10);syncMeetingFields();$("meetingHistory").innerHTML='<div class="muted">No previous meetings.</div>';showOnly("detailView");
}
function openClient(id){
 const c=clients.find(x=>x.id===id); if(!c)return; editingId=id;
 $("detailTitle").textContent=c.name;
 ["name","phone","email","country","initiated","submission","meetingRequired","meetingDate","meetingTime","payment","paymentDue","brief"].forEach(k=>$(k).value=c[k]||"");
 renderHistory(c);syncMeetingFields();showOnly("detailView");
}
function renderHistory(c){
 let history=c.meetings||[];
 $("meetingHistory").innerHTML=history.length?history.map(m=>`<div class="meeting"><span>${fmt(m.date)} ${m.time||""}</span><span class="muted">${esc(m.note||"Meeting")}</span></div>`).join(""):'<div class="muted">No previous meetings.</div>';
}
function syncMeetingFields(){
 const active=$("meetingRequired").value==="Yes";
 ["meetingDate","meetingTime"].forEach(id=>{
   const field=$(id).closest(".field");
   field.style.opacity=active?"1":".48";
   $(id).disabled=!active;
 });
}
$("meetingRequired").addEventListener("change",syncMeetingFields);

$("clientForm").addEventListener("submit",e=>{
 e.preventDefault();
 const data={id:editingId||Date.now().toString(),name:$("name").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim(),country:$("country").value.trim(),initiated:$("initiated").value,submission:$("submission").value,meetingRequired:$("meetingRequired").value,meetingDate:$("meetingDate").value,meetingTime:$("meetingTime").value,payment:$("payment").value,paymentDue:$("paymentDue").value,brief:$("brief").value,meetings:[]};
 if(editingId){let old=clients.find(x=>x.id===editingId);data.meetings=old?.meetings||[];clients=clients.map(x=>x.id===editingId?data:x)}else clients.push(data);
 save();showHome();
});
function renderClients(){
 const q=$("search").value.toLowerCase();
 const list=clients.filter(c=>(c.name+" "+c.phone+" "+c.email).toLowerCase().includes(q));
 $("clientList").innerHTML=list.length?`<div class="client-row" style="font-size:12px;font-weight:700;color:#777"><span>CLIENT</span><span>SUBMISSION</span><span>MEETING</span><span>PAYMENT</span><span></span></div>`+list.map(c=>`
 <div class="client-row" onclick="openClient('${c.id}')">
  <div><div class="client-name">${esc(c.name)}</div><div class="muted">${esc(c.email||c.phone||"No contact added")}</div></div>
  <div>${fmt(c.submission)}</div>
  <div>${c.meetingDate?fmt(c.meetingDate):"—"}</div>
  <div><span class="badge ${c.payment==="Received"?"paid":"due"}">${esc(c.payment||"Due")}</span></div>
  <div><button class="secondary" onclick="event.stopPropagation();openClient('${c.id}')">Edit</button></div>
 </div>`).join(""):'<div class="empty">No clients yet.<br><br>Click <b>Create New</b> to add your first client.</div>';
 $("totalClients").textContent=clients.length;
 $("dueCount").textContent=clients.filter(c=>c.payment!=="Received").length;
 const today=new Date();today.setHours(0,0,0,0);
 $("upcomingCount").textContent=clients.filter(c=>c.meetingDate&&new Date(c.meetingDate+"T00:00:00")>=today).length;
}
function showMeetings(){
 showOnly("simpleView");$("simpleTitle").textContent="Meetings";
 let upcoming=clients.filter(c=>c.meetingDate).sort((a,b)=>(a.meetingDate||"").localeCompare(b.meetingDate||""));
 $("simpleContent").innerHTML=upcoming.length?upcoming.map(c=>`<div class="meeting"><b>${esc(c.name)}</b><span>${fmt(c.meetingDate)} ${c.meetingTime||""}</span></div>`).join(""):"No meetings added.";
}
function showPayments(){
 showOnly("simpleView");$("simpleTitle").textContent="Payments";
 $("simpleContent").innerHTML=clients.length?clients.map(c=>`<div class="meeting"><b>${esc(c.name)}</b><span class="badge ${c.payment==="Received"?"paid":"due"}">${esc(c.payment||"Due")}</span></div>`).join(""):"No clients yet.";
}
applyTheme(localStorage.getItem(THEME_KEY)||"light");
renderClients();
</script>
</body>
</html>
